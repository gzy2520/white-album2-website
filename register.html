<!DOCTYPE html>
<html lang="zh_CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/loginregister.css">
    <title>注册</title>
</head>
<body>
    <div id="bg-box">
        <div class="top">
            <ul class="loginbar clearboth container">
                <li><a href="index.html">White<span>Album</span></a></li>
                <li>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="register.html">注册</a></li>
                <li><a href="login.html">登录</a></li>
            </ul>
        </div>
        <form action="register_process.php" method="POST" class="rigister-form login-form" id="registerForm">
            <h2>注册</h2>
            <div id="registerError" class="error-message" style="text-align: center; color: red; margin-bottom: 15px; display: none;"></div>
            <div class="account-bar">
                <label for="registerEmail">邮箱：</label>
                <input type="email" id="registerEmail" name="registerEmail" placeholder="请输入你的邮箱">
            </div>
            <div class="account-bar">
                <label for="registerAccount">账号：</label>
                <input type="text" id="registerAccount" name="registerAccount" placeholder="请输入10位数字学号">
                <div class="error-message" id="registerAccountError"></div>
            </div>
            <div class="account-bar">
                <label for="registerPassword">密码：</label>
                <input type="password" id="registerPassword" name="registerPassword" placeholder="请输入你的密码">
            </div>
            <div class="account-bar">
                <label for="registerConfirm">确认密码：</label>
                <input type="password" id="registerConfirm" name="registerConfirm" placeholder="请输入你的密码">
            </div>
            <div class="submit-bar"><input type="reset" value="重置"><input type="submit" value="提交"></div>
        </form>
    </div>
    
    <script>
        // 显示URL中的错误信息
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            document.getElementById('registerError').textContent = error;
            document.getElementById('registerError').style.display = 'block';
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const accountInput = document.getElementById('registerAccount');
            const errorElement = document.getElementById('registerAccountError');
            const account = accountInput.value.trim();
            
            // 清除之前的错误信息
            errorElement.textContent = '';
            accountInput.classList.remove('error');
            
            // 验证学号
            if (!/^\d{10}$/.test(account)) {
                e.preventDefault();
                errorElement.textContent = '学号必须是10位数字';
                accountInput.classList.add('error');
                accountInput.focus();
            }
        });
    </script>
</body>
</html>
