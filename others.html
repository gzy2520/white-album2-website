	<!-- Entrez 搜索引擎 -->
    <div class="entrez-container">
        <div class="entrez-header">
            <h2>Entrez 文献检索系统</h2>
            <p>使用NCBI的Entrez搜索引擎，访问PubMed、Nucleotide、Protein等数据库，获取生物医学研究文献</p>
        </div>
        
       <form id="entrezSearchForm" class="entrez-form" action="Entrez_do.php" method="post">
            <select name="db" class="search-select" id="databaseSelect">
                <option value="pubmed">PubMed</option>
                <option value="nucleotide">Nucleotide</option>
                <option value="protein">Protein</option>
                <option value="genome">Genome</option>
                <option value="structure">Structure</option>
                <option value="taxonomy">Taxonomy</option>
            </select>
            <input type="text" name="term" placeholder="请输入搜索关键词" class="search-input" id="searchTerm">
            <button type="submit" class="search-btn">开始检索</button>
        </form>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="get">AJAX-GET 模式</button>
            <button class="mode-btn" data-mode="post">AJAX-POST 模式</button>
            <button class="mode-btn" data-mode="session">SESSION 模式</button>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p>正在检索文献，请稍候...</p>
        </div>
        
        <div class="results-container" id="resultsContainer">
            <div class="results-header">
                <div class="results-count" id="resultsCount">找到 0 条结果</div>
            </div>
            <div id="resultsList"></div>
            <div class="pagination" id="pagination"></div>
        </div>
        
        <div class="deep-mining" id="deepMining">
            <h3>深度文献挖掘工具</h3>
            <div class="tool-container">
                <button class="tool-btn" data-tool="summary">
                    <i class="fas fa-file-alt"></i> 获取摘要
                </button>
                <button class="tool-btn" data-tool="related">
                    <i class="fas fa-link"></i> 相关文献
                </button>
                <button class="tool-btn" data-tool="citations">
                    <i class="fas fa-quote-right"></i> 引用文献
                </button>
                <button class="tool-btn" data-tool="similar">
                    <i class="fas fa-copy"></i> 相似文献
                </button>
                <button class="tool-btn" data-tool="download">
                    <i class="fas fa-download"></i> 下载数据
                </button>
            </div>
        </div>
    </div>


	<!-- 在HTML中添加地图容器 -->
	<div id="map-container"></div>

		<p><strong>当前位置：</strong> <span id="current-location">正在获取位置信息...</span></p>
		<p><strong>经纬度：</strong> <span id="coordinates">-</span></p>
		
	</div>
	<div class="map-controls">
		<button id="locate-btn">定位我的位置</button>
		<button id="reset-map">重置地图视图</button>
	</div>
